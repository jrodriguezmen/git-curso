name: Generar APK de Android

on:
  push:
    branches: ['**']
    paths-ignore: ['README.md']
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - name: Preparar los archivos de la app
        run: |
          mkdir -p www
          cp -r index.html style.css app.js sw.js manifest.webmanifest icons www/

      - name: Crear proyecto Android con Capacitor
        run: |
          npm init -y >/dev/null
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npx cap init "Mi Día" com.midia.app --web-dir www
          npx cap add android
          npx cap sync android

      - name: Compilar APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: mi-dia-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
